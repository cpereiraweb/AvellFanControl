name: Testar, gerar e publicar DEB
on:
  push:
    branches: [develop, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Testes sem acesso ao hardware
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 tests/check_manual_logic.py
          python3 tests/check_boost_logic.py driver/profiles/avell_profiles.c
      - name: Construir pacote
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            python3 packaging/build_deb.py --version "$version"
          else
            python3 packaging/build_deb.py
          fi
          dpkg-deb --info dist/*.deb
          dpkg-deb --control dist/*.deb /tmp/avell-control
          for script in preinst postinst prerm postrm; do
            sh -n "/tmp/avell-control/$script"
          done
          cd dist
          sha256sum *.deb > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: avell-thermal-deb
          path: dist/
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: avell-thermal-deb
          path: dist
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'EOF'
          Pacote Avell Thermal para Ubuntu, com interface GTK, ícone na área de notificação e driver DKMS.

          Hardware validado: Avell A65i / ION A65i, BIOS N.1.09AVE03. O pacote contém fontes do driver; a compilação ocorre durante a instalação. Testes de CI não substituem a validação física do notebook.

          Para instalar: baixe o .deb, encerre o aplicativo e execute `sudo apt install ./avell-thermal_*_all.deb` na pasta do download.

          SHA256SUMS acompanha o pacote para conferência da integridade.
          EOF
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Avell Thermal $RELEASE_TAG" --notes-file notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/*.deb dist/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false
